plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'app.laserplan.survey'
    compileSdk 35
    defaultConfig {
        applicationId 'app.laserplan.fusion'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.3'
    }
    // CI sets FUSION_DEBUG_KEYSTORE (from the DEBUG_KEYSTORE_B64 secret) so every debug APK has the
    // same signature and installs over the previous one. Local builds keep the normal debug key.
    signingConfigs {
        debug {
            def fixedKey = System.getenv('FUSION_DEBUG_KEYSTORE')
            if (fixedKey != null && file(fixedKey).exists()) {
                storeFile file(fixedKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

dependencies { implementation 'com.google.ar:core:1.48.0' }
