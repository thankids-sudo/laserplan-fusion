plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'app.laserplan.survey'
    compileSdk 35
    defaultConfig {
        applicationId 'app.laserplan.fusion'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '0.10'
    }
    // standard: no AI model (small APK). ai: adds MiDaS v2.1 Small (MIT) for the optional AI depth fill;
    // CI downloads the model from the official MiDaS release and checks its SHA-256 (never committed).
    flavorDimensions 'model'
    productFlavors {
        standard { dimension 'model' }
        ai { dimension 'model'; versionNameSuffix '-ai' }
    }
    androidResources { noCompress += 'tflite' }
    // CI sets FUSION_DEBUG_KEYSTORE (from the DEBUG_KEYSTORE_B64 secret) so every debug APK has the
    // same signature and installs over the previous one. Local builds keep the normal debug key.
    signingConfigs {
        debug {
            def fixedKey = System.getenv('FUSION_DEBUG_KEYSTORE')
            if (fixedKey != null && file(fixedKey).exists()) {
                storeFile file(fixedKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

dependencies {
    implementation 'com.google.ar:core:1.48.0'
    aiImplementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
}
