name: Build Android APK

on:
  push:
  workflow_dispatch:

# The build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_TOOLS: '35.0.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 35 and build tools
        run: sdkmanager 'platforms;android-35' "build-tools;${BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Report toolchain
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists and its signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::Debug APK was not produced at $APK"; exit 1; }
          SIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt \
            || { echo "::error::APK signature scheme v2 verification failed"; exit 1; }
          AAPT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          "$AAPT" dump badging "$APK" | head -3
          {
            echo "### LaserPlan Fusion debug APK"
            echo '```'
            ls -l "$APK"
            sha256sum "$APK"
            grep -E "Signer #1 certificate (DN|SHA-256)" apksigner.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LaserPlanFusion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
