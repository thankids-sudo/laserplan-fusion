name: Build Android APK

on:
  push:
  workflow_dispatch:

# The build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_TOOLS: '35.0.0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. android-actions/setup-android@v3
      # fails because it installs the removed 'tools' package, so use the preinstalled sdkmanager.
      - name: Install SDK platform 35 and build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK" || { echo "::error::Android SDK not found on runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' "build-tools;${BUILD_TOOLS}" 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Report toolchain
        run: |
          java -version
          gradle --version

      # Optional: a fixed debug key (repository secret DEBUG_KEYSTORE_B64, base64 of a debug.keystore
      # with the standard 'android' passwords) lets each new APK install over the previous one.
      - name: Use the fixed debug key when the secret is set
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_B64}" ]; then
            KS="${RUNNER_TEMP}/fusion-debug.keystore"
            printf '%s' "${DEBUG_KEYSTORE_B64}" | tr -d ' \r\n' | base64 -d > "$KS"
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256:" \
              || { echo "::error::DEBUG_KEYSTORE_B64 does not decode to a keystore with alias androiddebugkey and password android"; exit 1; }
            echo "FUSION_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "Using the fixed debug key from DEBUG_KEYSTORE_B64"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set. This APK gets a new debug key and will not install over the previous build."
          fi

      - name: Fetch MiDaS v2.1 Small (MIT, Intel ISL) for the ai build
        run: |
          set -euo pipefail
          mkdir -p app/src/ai/assets
          curl -sSfL --retry 3 -o app/src/ai/assets/midas_v21_small_256.tflite \
            https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite
          echo "93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd  app/src/ai/assets/midas_v21_small_256.tflite" | sha256sum -c -

      - name: Build debug APKs (standard and ai)
        run: gradle --no-daemon --stacktrace testStandardDebugUnitTest assembleStandardDebug assembleAiDebug

      - name: Verify APKs exist and their signatures
        run: |
          set -euo pipefail
          SIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          echo "### LaserPlan Fusion debug APKs" >> "$GITHUB_STEP_SUMMARY"
          for APK in app/build/outputs/apk/standard/debug/app-standard-debug.apk app/build/outputs/apk/ai/debug/app-ai-debug.apk; do
            test -s "$APK" || { echo "::error::APK was not produced at $APK"; exit 1; }
            "$SIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt \
              || { echo "::error::APK signature scheme v2 verification failed for $APK"; exit 1; }
            "$AAPT" dump badging "$APK" | head -1
            { echo '```'; ls -l "$APK"; sha256sum "$APK"; grep -E "Signer #1 certificate SHA-256" apksigner.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          unzip -l app/build/outputs/apk/ai/debug/app-ai-debug.apk | grep -q "assets/midas_v21_small_256.tflite" \
            || { echo "::error::ai APK is missing the MiDaS model"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: LaserPlanFusion-debug
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: LaserPlanFusion-ai-debug
          path: app/build/outputs/apk/ai/debug/app-ai-debug.apk
          if-no-files-found: error
          retention-days: 30
