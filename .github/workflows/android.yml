name: Build Android APK

on:
  push:
  workflow_dispatch:

# The build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUILD_TOOLS: '35.0.0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. android-actions/setup-android@v3
      # fails because it installs the removed 'tools' package, so use the preinstalled sdkmanager.
      - name: Install SDK platform 35 and build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK" || { echo "::error::Android SDK not found on runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' "build-tools;${BUILD_TOOLS}" 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Report toolchain
        run: |
          java -version
          gradle --version

      # Optional: a fixed debug key (repository secret DEBUG_KEYSTORE_B64, base64 of a debug.keystore
      # with the standard 'android' passwords) lets each new APK install over the previous one.
      - name: Use the fixed debug key when the secret is set
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_B64}" ]; then
            KS="${RUNNER_TEMP}/fusion-debug.keystore"
            printf '%s' "${DEBUG_KEYSTORE_B64}" | tr -d ' \r\n' | base64 -d > "$KS"
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256:" \
              || { echo "::error::DEBUG_KEYSTORE_B64 does not decode to a keystore with alias androiddebugkey and password android"; exit 1; }
            echo "FUSION_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "Using the fixed debug key from DEBUG_KEYSTORE_B64"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set. This APK gets a new debug key and will not install over the previous build."
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists and its signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::Debug APK was not produced at $APK"; exit 1; }
          SIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt \
            || { echo "::error::APK signature scheme v2 verification failed"; exit 1; }
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          "$AAPT" dump badging "$APK" | head -3
          {
            echo "### LaserPlan Fusion debug APK"
            echo '```'
            ls -l "$APK"
            sha256sum "$APK"
            grep -E "Signer #1 certificate (DN|SHA-256)" apksigner.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LaserPlanFusion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
